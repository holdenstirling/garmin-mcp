# Temporary: run the full test suite for fix-feedsync (removed before merge).
name: tmp-feedsync
on:
  push:
    branches: [fix-feedsync]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          set +e
          uv run -q pytest -q -rf -p no:cacheprovider > out.txt 2>&1; rc=$?
          tail -1 out.txt | sed 's/^/::warning::SUMMARY /'
          grep -E "^FAILED" out.txt | head -10 | sed 's/^/::error::/'
          grep -E "^E  " out.txt | head -10 | cut -c1-300 | sed 's/^/::warning::/'
          exit $rc
